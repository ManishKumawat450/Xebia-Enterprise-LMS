server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Hanusuman11!}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

lms:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:enterprise-lms}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:Admin User}
    initial-password: ${BOOTSTRAP_ADMIN_INITIAL_PASSWORD:}
